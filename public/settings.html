<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tsukamiyora — Настройки Cloud.ru</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#eee;font:15px system-ui,sans-serif}.layout{display:flex;min-height:100vh}nav{width:74px;border-right:1px solid #302b21;padding:20px 10px}nav a{display:block;color:#d7b876;text-align:center;font-size:25px;text-decoration:none;padding:12px}main{max-width:760px;width:100%;padding:38px 24px;margin:auto}h1{color:#d7b876;font-size:26px}section{background:#151518;border:1px solid #3c3427;border-radius:15px;padding:24px}label{display:block;margin:20px 0 8px}input,select{width:100%;background:#0e0e11;border:1px solid #66583b;color:white;border-radius:8px;padding:12px;font:inherit}input[type=checkbox]{width:auto}button{background:#c7a35e;border:0;border-radius:8px;color:#14100a;font-weight:650;padding:12px 16px;cursor:pointer;margin:12px 8px 0 0}button:disabled{opacity:.5}#status{margin-top:18px;white-space:pre-wrap;line-height:1.5}.muted{color:#aaa;font-size:13px}a{color:#d7b876}</style></head><body><div class="layout"><nav><a href="/" title="Главная">⌂</a><a href="/settings" title="Настройки">⚙</a></nav><main><h1>Настройки · Cloud.ru</h1><section><p class="muted">Foundation Models · Ключ остаётся на локальном сервере. Проверка списка моделей не расходует токены генерации.</p><label><input id="enabled" type="checkbox"> Включить Cloud.ru</label><label for="key">API-ключ Foundation Models</label><input id="key" type="password" autocomplete="new-password" placeholder="Введите новый ключ или оставьте пустым"><p id="configured" class="muted"></p><label for="model">Модель</label><select id="model"><option value="">Сначала загрузите список моделей</option></select><button id="save">Сохранить</button><button id="load">Загрузить модели</button><button id="test">Проверить ответ модели</button><div id="status" role="status" aria-live="polite">Статус: не проверено</div></section><p class="muted"><a href="https://cloud.ru/docs/foundation-models/ug/topics/quickstart" target="_blank" rel="noopener">Как получить API-ключ Cloud.ru</a></p></main></div><script>
const $=id=>document.getElementById(id),status=text=>$('status').textContent=text;
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const data=await response.json();if(!response.ok)throw Error(data.error||'HTTP '+response.status);return data}
async function init(){try{const d=await api('/api/cloud/settings');$('enabled').checked=d.enabled;$('configured').textContent=d.configured?'Ключ сохранён локально':'Ключ ещё не задан';if(d.model)$('model').add(new Option(d.model,d.model));status('Статус: '+(d.status?.status||'not_checked'))}catch(e){status('Ошибка: '+e.message)}}
$('save').onclick=async()=>{try{const d=await api('/api/cloud/settings',{method:'POST',body:JSON.stringify({enabled:$('enabled').checked,apiKey:$('key').value,model:$('model').value})});$('key').value='';$('configured').textContent=d.configured?'Ключ сохранён локально':'Ключ не задан';status('Настройки сохранены. Проверьте соединение.')}catch(e){status('Ошибка: '+e.message)}};
$('load').onclick=async()=>{try{status('Загрузка моделей...');const d=await api('/api/cloud/models');const old=$('model').value;$('model').replaceChildren(new Option('Выберите модель',''));for(const m of d.models)$('model').add(new Option(m.name,m.id));if([...$('model').options].some(o=>o.value===old))$('model').value=old;status('API онлайн. Доступно моделей: '+d.models.length+'. Выберите модель и сохраните.')}catch(e){status('Ошибка подключения: '+e.message)}};
$('test').onclick=async()=>{try{status('Проверяем реальный ответ модели...');const d=await api('/api/cloud/test',{method:'POST',body:'{}'});status(d.ok?'Модель онлайн: '+d.model:'Проверка не пройдена')}catch(e){status('Ошибка проверки: '+e.message)}};
init();
</script></body></html>
