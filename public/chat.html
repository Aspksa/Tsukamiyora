<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tsukamiyora — Чат</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b0b0d;color:#eee;font:15px system-ui,sans-serif}header{height:60px;border-bottom:1px solid #3b3426;display:flex;align-items:center;justify-content:space-between;padding:0 24px;color:#d7b876}a{color:#d7b876}main{max-width:850px;margin:auto;height:calc(100vh - 60px);display:flex;flex-direction:column;padding:16px}.welcome{text-align:center;margin:clamp(36px,12vh,110px) auto 0;max-width:520px;color:#d7b876}.welcome h1{font-size:32px;line-height:1.2;margin:0 0 12px;font-weight:650}.welcome p{font-size:14px;color:#bdb8ae;line-height:1.6}.welcome a{display:inline-block;margin-top:8px}#messages{flex:1;overflow:auto;padding:12px}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;background:#1b1b1e;border-radius:14px;padding:14px;margin:12px 0;max-width:90%;line-height:1.6}.user{margin-left:auto;background:#302a20}.assistant{border:1px solid #4b3d27}form{display:flex;gap:10px;padding:14px;border-top:1px solid #3b3426}textarea{flex:1;resize:vertical;min-height:52px;max-height:160px;background:#19191c;color:white;border:1px solid #6c5835;border-radius:12px;padding:14px;font:inherit}button{background:#c8a461;border:0;border-radius:12px;padding:12px 20px;color:#17120a;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}#status{color:#a9a9a9;font-size:12px;padding:4px 16px}</style></head><body><header><strong>Tsukamiyora · Чат</strong><a href="/settings">⚙ Настройки</a></header><main><div id="messages" aria-live="polite"><div id="welcome" class="welcome"><h1>Tsukamiyora</h1><p>Чат готов к работе. Напишите сообщение ниже. Для ответов ИИ настройте Cloud.ru.</p><a href="/settings">Настроить Cloud.ru</a> · <a href="/knowledge">Центр знаний</a></div></div><div id="status">Ожидание сообщения</div><form id="form"><textarea id="message" placeholder="Напишите сообщение..." required maxlength="8000"></textarea><button id="send">Отправить</button></form></main><script>
const $=id=>document.getElementById(id),messages=$('messages');const conversationId=sessionStorage.getItem('tsuka-chat-id')||crypto.randomUUID();sessionStorage.setItem('tsuka-chat-id',conversationId);
function add(text,role){$('welcome')?.remove();const node=document.createElement('div');node.className='bubble '+role;node.textContent=text;messages.append(node);messages.scrollTop=messages.scrollHeight;return node}
async function load(){try{const r=await fetch('/api/memory/'+encodeURIComponent(conversationId));const d=await r.json();for(const m of d.messages||[])add(m.content,m.role)}catch{}}
$('form').onsubmit=async e=>{e.preventDefault();const message=$('message').value.trim();if(!message)return;$('send').disabled=true;$('message').value='';add(message,'user');const output=add('','assistant');$('status').textContent='Cloud.ru: генерация...';
try{const response=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({conversationId,message,messageId:crypto.randomUUID()})});if(!response.ok){const d=await response.json();throw Error(d.error||'HTTP '+response.status)}
const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='',finished=false;
while(true){const {done,value}=await reader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});let idx;while((idx=buffer.indexOf('\n\n'))>=0){const frame=buffer.slice(0,idx);buffer=buffer.slice(idx+2);const line=frame.split('\n').find(x=>x.startsWith('data: '));if(!line)continue;const event=JSON.parse(line.slice(6));if(event.type==='delta'){output.textContent+=event.text;messages.scrollTop=messages.scrollHeight}else if(event.type==='done'){finished=true;$('status').textContent='Готово · память сохранена'}else if(event.type==='error')throw Error(event.error)}}}
if(!finished)throw Error('Соединение прервано до завершения ответа');
}catch(err){output.textContent+='\n[Ошибка: '+err.message+']';$('status').textContent='Ошибка соединения'}finally{$('send').disabled=false;$('message').focus()}};
load();
</script></body></html>
