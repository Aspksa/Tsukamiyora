name: Core CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Upload generated dependency lock
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
      - run: node --check src/server.js
      - run: node --check src/supervisor.js
      - run: node --check scripts/restore.js
      - run: node --test
      - run: node scripts/diagnose.js
      - run: node src/backup.js --run-backup
      - name: Check SQLite backup integrity
        run: node -e "const fs=require('fs');const {DatabaseSync}=require('node:sqlite');const files=fs.readdirSync('data/backups').filter(f=>f.endsWith('.sqlite'));if(!files.length)process.exit(1);const db=new DatabaseSync('data/backups/'+files[0]);if(db.prepare('PRAGMA integrity_check').get().integrity_check!=='ok')process.exit(2);db.close()"
      - name: API integration smoke test
        shell: pwsh
        run: |
          $env:TSUKAMIYORA_PORT = '4198'
          $p = Start-Process node -ArgumentList 'src/server.js' -PassThru -WorkingDirectory (Get-Location).Path -NoNewWindow
          try {
            $ready = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 500
              try { $health = Invoke-RestMethod 'http://127.0.0.1:4198/health' -TimeoutSec 1; if ($health.status -eq 'ok') { $ready=$true; break } } catch {}
            }
            if (-not $ready) { throw 'Server health timeout' }
            $job = Invoke-RestMethod 'http://127.0.0.1:4198/api/tasks' -Method Post -ContentType 'application/json' -Body '{"kind":"sum","payload":[2,3,5]}'
            $done = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Milliseconds 200
              $result = Invoke-RestMethod "http://127.0.0.1:4198/api/tasks/$($job.id)"
              if ($result.status -eq 'done') { if ($result.result -ne 10) { throw 'Incorrect task result' }; $done=$true; break }
            }
            if (-not $done) { throw 'Worker timeout' }
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }

      - name: Windows BAT launcher smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CI = 'true'
          $env:TSUKAMIYORA_PORT = '4199'
          try {
            & cmd.exe /c 'Tsukamiyora.bat'
            if ($LASTEXITCODE -ne 0) { throw "BAT exited with $LASTEXITCODE" }
            $response = Invoke-RestMethod 'http://127.0.0.1:4199/health' -TimeoutSec 5
            if ($response.status -ne 'ok' -or $response.database -ne 'ok' -or -not $response.instanceId) { throw 'Health check failed' }
            $chat = Invoke-WebRequest 'http://127.0.0.1:4199/chat' -UseBasicParsing -TimeoutSec 5
            if ($chat.StatusCode -ne 200 -or $chat.Content -notmatch 'id="welcome"') { throw 'Chat HTML not ready' }
            & cmd.exe /c 'Tsukamiyora.bat'
            if ($LASTEXITCODE -ne 0) { throw 'Second launch failed' }
          } finally {
            $connections = Get-NetTCPConnection -LocalPort 4199 -State Listen -ErrorAction SilentlyContinue
            $connections | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }
          }

      - name: Windows BAT launch from Cyrillic and special-character path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CI = 'true'
          $env:TSUKAMIYORA_PORT = '4207'
          $target = Join-Path $env:RUNNER_TEMP 'Tsukamiyora Мои проекты & ! ^ % (portable)'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          foreach ($item in @('Tsukamiyora.bat','package.json','scripts','src','public')) {
            Copy-Item -LiteralPath (Join-Path (Get-Location).Path $item) -Destination $target -Recurse -Force
          }
          Push-Location -LiteralPath $target
          try {
            & '.\Tsukamiyora.bat'
            if ($LASTEXITCODE -ne 0) { throw "Portable BAT exited with $LASTEXITCODE" }
            $health = Invoke-RestMethod 'http://127.0.0.1:4207/health' -TimeoutSec 5
            if ($health.status -ne 'ok' -or $health.database -ne 'ok' -or -not $health.instanceId) { throw 'Portable health check failed' }
            $chat = Invoke-WebRequest 'http://127.0.0.1:4207/chat' -UseBasicParsing -TimeoutSec 5
            if ($chat.StatusCode -ne 200 -or $chat.Content -notmatch 'id="welcome"' -or $chat.Content -notmatch 'id="message"') { throw 'Portable chat page not served' }
            $shortcut = Join-Path $target 'Открыть Tsukamiyora.url'
            if (-not (Test-Path -LiteralPath $shortcut)) { throw 'Browser shortcut was not created' }
            if ((Get-Content -LiteralPath $shortcut -Raw) -notmatch 'http://127.0.0.1:4207/chat') { throw 'Shortcut points to the wrong port' }
            & '.\Tsukamiyora.bat'
            if ($LASTEXITCODE -ne 0) { throw 'Portable second BAT launch failed' }
          } catch {
            foreach ($name in @('launcher.log','server-stderr.log','supervisor.jsonl')) {
              $p = Join-Path (Join-Path $target 'logs') $name
              if (Test-Path -LiteralPath $p) {
                Write-Host "=== $name ==="
                Get-Content -LiteralPath $p -Tail 60
              }
            }
            throw
          } finally {
            Pop-Location
            $connections = Get-NetTCPConnection -LocalPort 4207 -State Listen -ErrorAction SilentlyContinue
            $connections | ForEach-Object { Stop-Process -Id $_.OwningProcess -Force -ErrorAction SilentlyContinue }
          }
